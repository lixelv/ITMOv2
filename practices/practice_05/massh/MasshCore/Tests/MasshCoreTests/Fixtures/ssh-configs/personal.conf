# Personal machines
# managed by hand, please keep the order

Host bastion
    HostName bastion.example.com
    User ops
    Port 2222
    IdentityFile ~/.ssh/id_ed25519
    ForwardAgent yes

Host web-1 web1
    HostName 203.0.113.10
    User deploy
    ProxyJump bastion
    # legacy key, remove after migration
    IdentityFile ~/.ssh/legacy_rsa
    IdentityFile ~/.ssh/id_ed25519

Host *.prod !canary.prod
    User root

Host *
    ServerAliveInterval 30
    AddKeysToAgent yes
    UseKeychain yes
